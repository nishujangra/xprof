[package]
name = "xprof"
version = "0.0.0"
edition = "2024"
rust-version = "1.87"
description = "Native XDP profiler for Linux"
license = "GPL-2.0-or-later"
readme = "README.md"
repository = "https://github.com/nishujangra/xprof"
keywords = ["xdp", "ebpf", "bpf", "profiler", "linux"]
categories = ["command-line-utilities", "development-tools::profiling"]
publish = false

[[bin]]
name = "xprof"
path = "src/main.rs"

[dependencies]
aya = "0.14"
aya-obj = "0.3"
clap = { version = "4.6.5", features = ["derive"] }
libc = "0.2.189"
netlink-packet-core = { version = "0.8.1", default-features = false }
netlink-packet-route = { version = "0.31.0", default-features = false }
netlink-sys = { version = "0.8.8", default-features = false }
thiserror = "2.0.19"

[dev-dependencies]

[profile.release]
# Profiling xprof itself is a stated project requirement, and symbolizing our
# own stacks needs debug info in release builds.
debug = true
